name: Phase quality checks

on:
  push:
    branches:
      - "phase/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src

      - name: Run pytest with repository coverage
        run: python -m pytest --cov-report=term-missing --cov-report=xml --cov-report=json

      - name: Enforce repository and per-package coverage
        run: >-
          PYTHONPATH=src python -m scripts.check_phase13_core_coverage
          --output-dir /tmp/aegishunt-phase13-core-coverage

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audited environment
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -e ".[dev]"

      - name: Test fail-closed security parsers
        run: >-
          python -m pytest --no-cov -q
          tests/unit/test_phase13_security_gate.py
          tests/unit/test_phase13_security_findings.py

      - name: Validate complete Codex Security ledger
        run: PYTHONPATH=src python -m scripts.validate_phase13_security_findings

      - name: Run dependency, secret-history, and Bandit gates
        run: >-
          PYTHONPATH=src python -m scripts.run_phase13_security
          --output /tmp/aegishunt-phase13-security-summary.json

  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -e ".[dev]"

      - name: Run malformed-input and boundary regressions
        run: >-
          python -m pytest --no-cov -q
          tests/security
          tests/unit/test_artifact_io_boundaries.py
          tests/unit/test_phase13_integrity.py
          tests/unit/test_phase13_robustness_tools.py

      - name: Run Phase 13 robustness smoke
        run: >-
          PYTHONPATH=src python -m scripts.run_phase13_robustness
          --smoke
          --output-dir /tmp/aegishunt-phase13-robustness-smoke

  performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -e ".[dev]"

      - name: Verify percentile, API, and memory contracts
        run: python -m pytest --no-cov -q tests/unit/test_phase13_benchmark_tools.py

      - name: Run deterministic benchmark smoke
        run: >-
          PYTHONPATH=src python -m scripts.run_phase13_benchmark
          --smoke
          --output-dir /tmp/aegishunt-phase13-benchmark-smoke

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package build tools
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install "build>=1.3,<2.0" "twine>=6.1,<7.0"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Validate distribution inventory
        run: >-
          PYTHONPATH=src python -m scripts.verify_phase14_distribution
          --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          --sdist "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build without installing AegisHunt
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install "build>=1.3,<2.0"
          python -m build --wheel

      - name: Install wheel non-editably
        run: python -m pip install dist/*.whl

      - name: Verify installed package and dependencies
        run: |
          unset PYTHONPATH
          python -m pip check
          python -c "import aegishunt; assert 'site-packages' in aegishunt.__file__"
          aegishunt --help
          aegishunt doctor --help
          aegishunt init-db --help
          aegishunt runtime --help
          aegishunt demo --help

      - name: Prepare clean companion workspace
        run: |
          workspace="$(mktemp -d)"
          mkdir -p "${workspace}/data"
          cp -R configs "${workspace}/"
          cp -R data/sample "${workspace}/data/"
          cp pyproject.toml "${workspace}/"
          echo "AEGISHUNT_CLEAN_WORKSPACE=${workspace}" >> "$GITHUB_ENV"
          echo "AEGISHUNT_CONFIG=${workspace}/configs/application.yaml" >> "$GITHUB_ENV"
          echo "AEGISHUNT_DATABASE_URL=sqlite:///${workspace}/aegishunt.sqlite3" >> "$GITHUB_ENV"
          echo "AEGISHUNT_INGESTION__SAMPLE_ROOT=${workspace}/data/sample" >> "$GITHUB_ENV"

      - name: Initialize and inspect API from installed wheel
        working-directory: ${{ env.AEGISHUNT_CLEAN_WORKSPACE }}
        run: |
          unset PYTHONPATH
          aegishunt init-db
          aegishunt demo run \
            --sample-id phase14-attack-like-pcap \
            --actor phase14-clean-install \
            --reason "explicit clean-wheel controlled demo" \
            --confirm
          python - <<'PY'
          from fastapi.testclient import TestClient
          from aegishunt.api.app import create_app
          from aegishunt.config import load_settings
          from aegishunt.storage import Database
          settings = load_settings()
          database = Database(settings.database)
          with TestClient(create_app(settings, database)) as client:
              assert client.get("/health").status_code == 200
              assert client.get("/openapi.json").status_code == 200
              assert client.get("/flows/summary").json()["total"] == 42
              assert client.get("/runtime/jobs").json()["total"] == 1
          database.dispose()
          PY
          aegishunt runtime worker run --once --worker-id phase14-clean-install

      - name: Verify installed Streamlit health
        working-directory: ${{ env.AEGISHUNT_CLEAN_WORKSPACE }}
        run: |
          unset PYTHONPATH
          aegishunt frontend --address 127.0.0.1 --port 18501 --headless &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:18501/_stcore/health", timeout=2
                  ) as response:
                      assert response.status == 200
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Streamlit health did not become ready")
          PY

  docs-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -e ".[dev]"

      - name: Validate delivery documentation and evidence
        run: PYTHONPATH=src python -m scripts.validate_phase14_delivery

      - name: Run final-delivery contract tests
        run: >-
          python -m pytest --no-cov -q
          tests/unit/test_phase14_delivery.py
          tests/unit/test_phase14_samples.py
          tests/unit/test_release_manifest.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Compose configuration
        run: docker compose -p aegishunt-phase14-ci config --quiet

      - name: Build local release image
        run: docker compose -p aegishunt-phase14-ci build --no-cache

      - name: Verify image runtime user
        run: |
          test "$(docker image inspect aegishunt:1.0.0 --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL aegishunt:1.0.0 --help

      - name: Start local services and verify health
        run: |
          trap 'docker compose -p aegishunt-phase14-ci down -v' EXIT
          docker compose -p aegishunt-phase14-ci up -d
          python - <<'PY'
          import time
          import urllib.request
          for url in (
              "http://127.0.0.1:8000/health",
              "http://127.0.0.1:8000/openapi.json",
              "http://127.0.0.1:8501/_stcore/health",
          ):
              for _ in range(90):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          assert response.status == 200
                          break
                  except OSError:
                      time.sleep(1)
              else:
                  raise SystemExit(f"service health did not become ready: {url}")
          PY
          test "$(docker compose -p aegishunt-phase14-ci exec -T api id -u)" = "10001"
          test "$(docker compose -p aegishunt-phase14-ci exec -T worker id -u)" = "10001"
          docker compose -p aegishunt-phase14-ci stop worker
          docker compose -p aegishunt-phase14-ci exec -T api aegishunt demo run \
            --sample-id phase14-attack-like-pcap \
            --actor phase14-docker-ci \
            --reason "explicit container controlled demo" \
            --confirm \
            --create-case
          test "$(curl --fail --silent http://127.0.0.1:8000/flows/summary | \
            python -c 'import json,sys; print(json.load(sys.stdin)[\"total\"])')" = "42"
          docker compose -p aegishunt-phase14-ci start worker
          docker compose -p aegishunt-phase14-ci restart api worker frontend
          sleep 10
          curl --fail --silent http://127.0.0.1:8000/health
          test "$(curl --fail --silent http://127.0.0.1:8000/runtime/jobs | \
            python -c 'import json,sys; print(json.load(sys.stdin)[\"total\"])')" = "1"
          docker compose -p aegishunt-phase14-ci exec -T api python - <<'PY'
          import sqlite3
          connection = sqlite3.connect("runtime/data/aegishunt.db")
          assert connection.execute("PRAGMA integrity_check").fetchone() == ("ok",)
          connection.close()
          PY
          docker compose -p aegishunt-phase14-ci down -v

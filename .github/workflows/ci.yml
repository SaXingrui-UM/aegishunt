name: Phase quality checks

on:
  push:
    branches:
      - "phase/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # The branch-aware suite includes bounded training/E2E checks and can exceed
    # 15 minutes on a slower hosted runner even when every test passes.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src

      - name: Run pytest with coverage
        run: pytest

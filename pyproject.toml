[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegishunt"
version = "0.1.0"
description = "Autonomous threat hunting research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "numpy>=1.26.4,<2.0",
  "pydantic>=2.10,<3.0",
  "python-multipart>=0.0.20,<0.1",
  "PyYAML>=6.0,<7.0",
  "scikit-learn>=1.6,<1.8",
  "skops>=0.11,<0.14",
  "SQLAlchemy>=2.0,<2.1",
  "streamlit>=1.41,<1.46",
  "typer>=0.15,<0.16",
  "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.28",
  "mypy>=1.13,<1.15",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
aegishunt = "aegishunt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=aegishunt",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=85",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["streamlit"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "sklearn.*", "skops.*"]
follow_imports = "skip"
ignore_missing_imports = true

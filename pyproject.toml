[build-system]
requires = ["setuptools>=83.0.0,<84.0.0", "wheel>=0.46.2,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "aegishunt"
dynamic = ["version"]
description = "Autonomous threat hunting research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.3.3,<9.0",
  "fastapi>=0.140.13,<0.141",
  "GitPython>=3.1.55,<4.0",
  "httpx>=0.27,<0.28",
  "matplotlib>=3.9,<3.11",
  "numpy>=1.26.4,<2.0",
  "Pillow>=12.3,<13.0",
  "pydantic>=2.10,<3.0",
  "psutil>=6.1,<8.0",
  "python-multipart>=0.0.20,<0.1",
  "PyYAML>=6.0,<7.0",
  "scikit-learn>=1.6,<1.8",
  "skops>=0.11,<0.14",
  "SQLAlchemy>=2.0,<2.1",
  "starlette>=1.3.1,<2.0",
  "streamlit>=1.60,<1.61",
  "typer>=0.27,<0.28",
  "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "build>=1.3,<2.0",
  "detect-secrets==1.5.0",
  "mypy>=1.13,<1.15",
  "pip-audit==2.10.1",
  "pre-commit>=4.0,<5.0",
  "pytest>=9.1,<10.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "setuptools>=83.0.0,<84.0.0",
  "twine>=6.1,<7.0",
  "types-psutil>=6.1,<8.0",
  "types-PyYAML>=6.0,<7.0",
  "wheel>=0.46.2,<0.47",
]

[project.scripts]
aegishunt = "aegishunt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aegishunt.metadata.__version__"}

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=aegishunt",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=85",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["streamlit"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "sklearn.*", "skops.*"]
follow_imports = "skip"
ignore_missing_imports = true

dataset_id: cic-ids2017
mapping_version: 1.0.0
unknown_label_policy: fail
rules:
  - aliases: [benign]
    ground_truth_label: benign
    binary_label: 0
    attack_family: benign
  - aliases: [ftp-patator, ssh-patator]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: brute_force
  - aliases: [portscan]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: reconnaissance
  - aliases: [dos slowloris, dos slowhttptest, dos hulk, dos goldeneye, ddos]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: denial_of_service
  - aliases: [bot]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: botnet
  - aliases: [infiltration]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: infiltration
  - aliases: [heartbleed]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: heartbleed
  - aliases: [web attack - brute force]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: web_brute_force
  - aliases: [web attack - xss]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: cross_site_scripting
  - aliases: [web attack - sql injection]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: sql_injection

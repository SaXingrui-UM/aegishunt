dataset_id: ton-iot
mapping_version: 1.0.0
unknown_label_policy: fail
rules:
  - aliases: [normal]
    ground_truth_label: benign
    binary_label: 0
    attack_family: benign
  - aliases: [backdoor, ddos, dos, injection, mitm, password, ransomware, scanning, xss]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: dataset_attack_family

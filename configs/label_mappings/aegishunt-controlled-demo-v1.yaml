dataset_id: aegishunt-controlled-demo
mapping_version: 1.0.0
unknown_label_policy: fail
rules:
  - aliases: [benign, normal]
    ground_truth_label: benign
    binary_label: 0
    attack_family: benign
  - aliases: [scan]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: reconnaissance
  - aliases: [brute-force]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: brute_force
  - aliases: [beacon]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: command_and_control
  - aliases: [exfiltration]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: exfiltration
  - aliases: [connection-flood]
    ground_truth_label: malicious
    binary_label: 1
    attack_family: denial_of_service

config_schema_version: 1.0.0
experiment_id: phase-06-controlled-demo
model_version: 1.0.0
random_seed: 6106
minimum_benign_groups: 3
false_positive_rate_limit: 0.25
threshold_candidates: [0.40, 0.50, 0.60, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
normalization_quantiles: 101
latency_repetitions: 50
bootstrap_iterations: 1000
selection_policy_version: 1.0.0
normalization_version: 1.0.0
isolation_forest_candidates:
  - candidate_id: iforest-64-full
    n_estimators: 64
    max_samples: 1.0
    max_features: 1.0
    bootstrap: false
    contamination: auto
    n_jobs: 1
  - candidate_id: iforest-128-full
    n_estimators: 128
    max_samples: 1.0
    max_features: 1.0
    bootstrap: false
    contamination: auto
    n_jobs: 1
  - candidate_id: iforest-128-subspace
    n_estimators: 128
    max_samples: 0.8
    max_features: 0.75
    bootstrap: false
    contamination: auto
    n_jobs: 1
lof:
  enabled: true
  n_neighbors: 5
  metric: minkowski
  algorithm: auto
  leaf_size: 30
  n_jobs: 1
one_class_svm_status: not_implemented
one_class_svm_reason: >-
  Not implemented due to bounded Phase 6 scope, quadratic scaling risk, and the
  limited benign controlled-demo sample; no extra dependency or hidden fallback is required.

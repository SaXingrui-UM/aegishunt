config_schema_version: 1.0.0
experiment_id: phase-05-controlled-demo
model_version: 1.0.0
random_seed: 5105
cv_folds: 3
primary_metric: macro_f1
calibration_methods: [sigmoid, isotonic]
min_isotonic_samples_per_class: 3
threshold_candidates: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
latency_repeats: 50
bootstrap_iterations: 1000
selection_policy_version: 1.0.0
candidates:
  - algorithm: dummy
    parameters:
      strategy: [most_frequent, prior]
  - algorithm: logistic_regression
    parameters:
      C: [0.1, 1.0]
      class_weight: [none, balanced]
      max_iter: [1000]
      solver: [liblinear]
  - algorithm: decision_tree
    parameters:
      max_depth: [3, 5]
      min_samples_split: [2]
      min_samples_leaf: [1, 2]
      class_weight: [none, balanced]
  - algorithm: random_forest
    parameters:
      n_estimators: [64]
      max_depth: [4, 8]
      min_samples_split: [2]
      min_samples_leaf: [1]
      max_features: [sqrt]
      class_weight: [none, balanced]
      n_jobs: [1]
  - algorithm: hist_gradient_boosting
    parameters:
      learning_rate: [0.05, 0.1]
      max_iter: [100]
      max_leaf_nodes: [7, 15]
      min_samples_leaf: [2]
      l2_regularization: [0.0, 1.0]
      early_stopping: [false]
